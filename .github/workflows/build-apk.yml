name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 兩個大檔案(ffmpeg 函式庫、語音模型)因為太大無法透過網頁上傳,
      # 這裡從原作者的 repo 取回來放到原本的位置。
      - name: Fetch large files from original repo
        run: |
          set -e
          NEED=0
          [ -f app/libs/ffmpeg-kit.aar ] || NEED=1
          [ -f app/src/main/assets/models/ggml-base.en-q5_1.bin ] || NEED=1
          if [ "$NEED" = "1" ]; then
            git clone --depth 1 https://github.com/Serkali-sudo/auto-subtitle-generator.git /tmp/orig
            mkdir -p app/libs app/src/main/assets/models
            [ -f app/libs/ffmpeg-kit.aar ] || cp /tmp/orig/app/libs/ffmpeg-kit.aar app/libs/
            [ -f app/src/main/assets/models/ggml-base.en-q5_1.bin ] || cp /tmp/orig/app/src/main/assets/models/ggml-base.en-q5_1.bin app/src/main/assets/models/
          fi
          ls -la app/libs app/src/main/assets/models

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 使用 GitHub 主機內建的 Android SDK,不再另外安裝 setup-android(它會因為找不到 tools 套件而失敗)
      - name: Install NDK and CMake
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
          else
            echo "::warning::未設定 KEYSTORE_BASE64,這次會用 debug 金鑰簽名,無法覆蓋安裝已用其他金鑰安裝的版本。"
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew "$TASK" --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autosub-apk
          path: app/build/outputs/apk/**/*arm64-v8a*.apk

      # 發布成 GitHub Release,Obtainium 才能用 repo 網址直接下載安裝
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoSub mp3 build ${{ github.run_number }}
          files: app/build/outputs/apk/**/*arm64-v8a*.apk
